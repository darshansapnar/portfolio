<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="netflixRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="55%" stop-color="#D10813" />
      <stop offset="100%" stop-color="#94050D" />
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="320" height="320" rx="56" fill="url(#netflixRed)" />

  <!-- Subtle Top Specular Sheen for Premium Depth -->
  <rect width="320" height="160" rx="56" fill="url(#sheen)" />

  <!-- Left Eye -->
  <circle cx="70" cy="104" r="17.5" fill="#FFFFFF" />

  <!-- Right Eye -->
  <circle cx="263" cy="104" r="17" fill="#FFFFFF" />

  <!-- Iconic Netflix Smirk / Smile -->
  <path d="M 141 178 C 170 203 245 204 282 174" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="14" 
        stroke-linecap="round" />
</svg>
